<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Finder Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="homepage">
        <h1>Welcome to Hotel Finder</h1>
        <p>Click the chat icon to find your perfect hotel!</p>
    </div>

    <!-- Chat Icon -->
    <div class="chat-icon" id="chatIcon">
        💬
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
        <div class="chat-header">
            <span>Hotel Assistant</span>
            <button class="close-btn" id="closeBtn">×</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="bot-message">
                Hi! I'm here to help you find hotels. Choose an option below:
            </div>
        </div>

        <div class="quick-options">
            <button class="option-btn" data-message="I need a budget hotel">Budget Hotels</button>
            <button class="option-btn" data-message="I want luxury accommodation">Luxury Hotels</button>
            <button class="option-btn" data-message="Show me hotels near airport">Near Airport</button>
            <button class="option-btn" data-message="I need family-friendly hotels">Family Hotels</button>
        </div>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
