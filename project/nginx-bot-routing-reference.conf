server {
    server_name kaunsahostel.com www.kaunsahostel.com;

    root /var/www/project/project/frontend/dist;
    index index.html;

    # >>> ADDED: Bot intercept for hostel pages <<<
    location /hostel/ {
        if ($http_user_agent ~* "facebookexternalhit|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot") {
            rewrite ^/hostel/(.*)$ https://api.kaunsahostel.com/hostel/$1 redirect;
        }
        try_files $uri /index.html;
    }

    # Standard React routing
    location / {
        try_files $uri /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kaunsahostel.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kaunsahostel.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kaunsahostel.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kaunsahostel.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kaunsahostel.com www.kaunsahostel.com;
    return 404; # managed by Certbot
}
