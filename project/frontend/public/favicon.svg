<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with Gradient -->
  <rect width="100" height="100" rx="24" fill="url(#bg)" />
  
  <!-- Building Base & Towers -->
  <g fill="#111827" filter="url(#shadow)">
    <!-- Base Platform -->
    <rect x="20" y="76" width="60" height="6" rx="3" />
    
    <!-- Main Building Block -->
    <rect x="26" y="26" width="48" height="50" rx="4" />
    
    <!-- Modern Roof Overhang -->
    <rect x="22" y="20" width="56" height="6" rx="3" />
  </g>

  <!-- Windows & Door -->
  <g fill="#ffffff">
    <!-- Top Row -->
    <rect x="32" y="34" width="10" height="10" rx="2" />
    <rect x="45" y="34" width="10" height="10" rx="2" />
    <rect x="58" y="34" width="10" height="10" rx="2" />
    
    <!-- Middle Row -->
    <rect x="32" y="48" width="10" height="10" rx="2" />
    <rect x="45" y="48" width="10" height="10" rx="2" />
    <rect x="58" y="48" width="10" height="10" rx="2" />
    
    <!-- Bottom Row (Door in Center) -->
    <rect x="32" y="62" width="10" height="10" rx="2" />
    <rect x="58" y="62" width="10" height="10" rx="2" />
    
    <!-- Door -->
    <rect x="44" y="60" width="12" height="16" rx="3" />
  </g>
</svg>
